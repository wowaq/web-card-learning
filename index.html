<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карточки</title>
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  :root { --bg:#111; --fg:#eee; --mut:#888; --line:#2a2a2a; }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    display:flex; align-items:center; gap:12px;
    padding:12px 16px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--bg); z-index:5;
  }
  header h1 { font-size:16px; margin:0; font-weight:600; flex:1; }
  button, select, input, textarea {
    font:inherit; color:inherit; background:#1b1b1b;
    border:1px solid var(--line); border-radius:8px; padding:6px 10px;
  }
  button { cursor:pointer; }
  button:hover { background:#252525; }
  button.primary { background:#2a4; border-color:#2a4; color:#041; font-weight:600; }
  button.danger { background:#a33; border-color:#a33; color:#fff; }
  main { max-width:820px; margin:0 auto; padding:16px; }

  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .muted { color:var(--mut); }
  .card {
    border:1px solid var(--line); border-radius:12px; padding:14px;
    margin:10px 0; transition:transform .15s, background .2s;
  }
  .card.remembered {
    background: linear-gradient(45deg, #0d3 0%, #000 10%);
    border-color:#0a5;
  }
  .card.not-remembered {
    background: linear-gradient(45deg, #a00 0%, #000 10%);
    border-color:#811;
  }
  .card h3 { margin:0 0 6px; font-size:17px; }
  .card .answer { margin:4px 0 10px; }
  .card .status { font-size:13px; opacity:.9; }
  /* режимы отображения */
  #cards.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
  }
  #cards.grid .card { margin: 0; }
  #cards.list .card { margin: 10px 0; }
  .view-toggle { display: flex; gap: 4px; }
  .view-toggle button { padding: 6px 8px; line-height: 1; }
  .view-toggle button.active { background: #2a4; border-color: #2a4; color: #041; }

  .filter { display:flex; gap:6px; margin:10px 0; }
  .filter button.active { background:#2a4; border-color:#2a4; color:#041; font-weight:600; }

  /* тренировка */
  .trainer { display:flex; flex-direction:column; gap:12px; }
  .swipe-area { position:relative; height:340px; }
  .swipe-card {
    position:absolute; inset:0;
    border:1px solid var(--line); border-radius:16px; padding:24px;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; background:#1b1b1b;
    touch-action: none; user-select:none; cursor:grab;
    transition:transform .2s, opacity .2s;
  }
  .swipe-card .title { font-size:22px; font-weight:600; margin-bottom:12px; }
  .swipe-card .ans { font-size:20px; }
  .swipe-card.gone-left { transform:translateX(-120%) rotate(-14deg); opacity:0; }
  .swipe-card.gone-right { transform:translateX(120%) rotate(14deg); opacity:0; }
  .hint { text-align:center; color:var(--mut); font-size:13px; }
  .bottom { display:flex; gap:10px; }
  .bottom button { flex:1; padding:12px; font-size:16px; }

  .hidden { display:none !important; }
  .katex { font-size:1.05em; }
</style>
</head>
<body>
<header>
  <h1 id="title">Карточки</h1>
  <div class="view-toggle" id="view-toggle">
    <button data-v="grid" title="Сетка">▦</button>
    <button data-v="list" title="Список">☰</button>
  </div>
  <button id="btn-back" class="hidden">← Назад</button>
</header>

<main>
  <!-- список коллекций -->
  <section id="view-list">
    <p class="muted">Папка <code>collections/</code></p>
    <div id="collections"></div>
  </section>

  <!-- коллекция -->
  <section id="view-collection" class="hidden">
    <div class="filter" id="filters">
      <button data-f="all" class="active">Все</button>
      <button data-f="yes">Запомнил</button>
      <button data-f="no">Не запомнил</button>
    </div>
    <div class="row">
      <button id="btn-edit">Редактировать md</button>
      <button id="btn-train" class="primary">Тренировка</button>
    </div>
    <div id="cards"></div>
  </section>

  <!-- редактор -->
  <section id="view-edit" class="hidden">
    <p class="muted" id="edit-file"></p>
    <textarea id="editor" spellcheck="false"
      style="width:100%; height:60vh; font-family:ui-monospace, monospace;"></textarea>
    <div class="row" style="margin-top:10px">
      <button id="btn-save" class="primary">Сохранить</button>
      <button id="btn-cancel">Отмена</button>
    </div>
  </section>

  <!-- тренировка -->
  <section id="view-train" class="hidden">
    <div id="train-setup">
      <p class="muted">Коллекции:</p>
      <div id="train-colls" class="row" style="flex-direction:column; align-items:stretch"></div>
      <div class="row" style="margin-top:12px">
        <label>Карточек: <input id="train-count" type="number" min="1" value="10" style="width:80px"></label>
        <label>Порядок:
          <select id="train-order">
            <option value="random">Случайный</option>
            <option value="asc">По возрастанию</option>
            <option value="strict">Строгий</option>
          </select>
        </label>
        <label>Карточки:
          <select id="train-filter">
            <option value="all">Все</option>
            <option value="yes">Запомненные</option>
            <option value="no">Не запомненные</option>
          </select>
        </label>
      </div>
      <div class="row" style="margin-top:12px">
        <button id="btn-start" class="primary">Начать</button>
        <button id="btn-train-cancel">Отмена</button>
      </div>
    </div>

    <div id="train-run" class="trainer hidden">
      <div class="hint" id="train-progress"></div>
      <div class="swipe-area">
        <div class="swipe-card" id="swipe-card">
          <div class="title" id="swipe-title"></div>
          <div class="ans" id="swipe-answer"></div>
        </div>
      </div>
      <div class="hint">Свайп влево — не запомнил, вправо — запомнил. Пробел — показать ответ.</div>
      <div class="bottom">
        <button id="btn-no" class="danger">Не запомнил</button>
        <button id="btn-show">Показать ответ</button>
        <button id="btn-yes" class="primary">Запомнил</button>
      </div>
    </div>
  </section>
</main>

<script src="katex/katex.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const api = {
  list:  () => fetch('/api/collections').then(r => r.json()),
  get:   f  => fetch('/api/collections/' + encodeURIComponent(f)).then(r => r.json()),
  put:   (f, raw) => fetch('/api/collections/' + encodeURIComponent(f), {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({raw})
  }).then(r => r.json()),
  status:(f, index, remembered) => fetch(
    '/api/collections/' + encodeURIComponent(f) + '/status', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({index, remembered})
  }).then(r => r.json()),
};

// ---------- рендер ----------
function show(view) {
  ['list','collection','edit','train'].forEach(v =>
    $('#view-' + v).classList.toggle('hidden', v !== view));
  $('#btn-back').classList.toggle('hidden', view === 'list');
}

// мини-кэш KaTeX: true, если строка содержит $...$ или $$...$$
function renderMath(el, text) {
  if (typeof katex === 'undefined') { el.textContent = text; return; }
  const parts = String(text).split(/(\$\$[\s\S]+?\$\$|\$[^$\n]+?\$)/g);
  el.innerHTML = '';
  for (const p of parts) {
    if (!p) continue;
    if (p.startsWith('$$') && p.endsWith('$$')) {
      const span = document.createElement('span');
      try { katex.render(p.slice(2,-2), span, {displayMode:true, throwOnError:false}); }
      catch { span.textContent = p; }
      el.appendChild(span);
    } else if (p.startsWith('$') && p.endsWith('$')) {
      const span = document.createElement('span');
      try { katex.render(p.slice(1,-1), span, {throwOnError:false}); }
      catch { span.textContent = p; }
      el.appendChild(span);
    } else {
      el.appendChild(document.createTextNode(p));
    }
  }
}

let current = null, filter = 'all';
let viewMode = localStorage.getItem('viewMode') || 'list';
async function loadList() {
  show('list'); $('#title').textContent = 'Карточки'; current = null;
  const items = await api.list();
  const box = $('#collections'); box.innerHTML = '';
  if (!items.length) {
    box.innerHTML = '<p class="muted">Пусто. Добавь .md файл в collections/.</p>';
    return;
  }
  for (const c of items) {
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = `<h3></h3><div class="status muted"></div>`;
    d.querySelector('h3').textContent = c.name;
    d.querySelector('.status').textContent =
      `${c.remembered} / ${c.total} запомнил · ${c.created || '—'} · ${c.file}`;
    d.onclick = () => openCollection(c.file);
    box.appendChild(d);
  }
}

async function openCollection(file) {
  current = await api.get(file);
  $('#title').textContent = current.name;
  filter = 'all';
  document.querySelectorAll('#filters button').forEach(b =>
    b.classList.toggle('active', b.dataset.f === 'all'));
  renderCards(); show('collection');
}

function renderCards() {
  const box = $('#cards'); box.innerHTML = '';
  box.className = viewMode;
  current.cards.forEach((c, i) => {
    if (filter === 'yes' && !c.remembered) return;
    if (filter === 'no'  &&  c.remembered) return;
    const d = document.createElement('div');
    d.className = 'card ' + (c.remembered ? 'remembered' : 'not-remembered');
    const h = document.createElement('h3'); renderMath(h, c.title);
    const a = document.createElement('div'); a.className = 'answer';
    if (c.answer) renderMath(a, c.answer);
    const s = document.createElement('div'); s.className = 'status';
    s.textContent = c.remembered ? 'Запомнил' : 'Не запомнил';
    const btn = document.createElement('button');
    btn.textContent = c.remembered ? '→ Не запомнил' : '→ Запомнил';
    btn.style.marginTop = '8px';
    btn.onclick = async () => {
      const r = await api.status(current.file, i, !c.remembered);
      c.remembered = r.remembered;
      renderCards();
    };
    d.append(h, a, s, btn);
    box.appendChild(d);
  });
}

// ---------- редактор ----------
$('#btn-edit').onclick = () => {
  $('#editor').value = current.raw;
  $('#edit-file').textContent = current.file;
  show('edit');
};
$('#btn-save').onclick = async () => {
  await api.put(current.file, $('#editor').value);
  await openCollection(current.file);
};
$('#btn-cancel').onclick = () => openCollection(current.file);

// ---------- тренировка ----------
let train = null; // {queue, index, revealed, fileOf}

$('#btn-train').onclick = () => {
  const box = $('#train-colls'); box.innerHTML = '';
  api.list().then(items => {
    items.forEach(c => {
      const l = document.createElement('label');
      l.className = 'row';
      l.innerHTML = `<input type="checkbox" value="${c.file}"> <span></span>
                     <span class="muted">(${c.total})</span>`;
      l.querySelector('span').textContent = c.name;
      box.appendChild(l);
    });
  });
  $('#train-setup').classList.remove('hidden');
  $('#train-run').classList.add('hidden');
  show('train');
};

$('#btn-start').onclick = async () => {
  const files = [...document.querySelectorAll('#train-colls input:checked')]
    .map(i => i.value);
  if (!files.length) return alert('Выбери хотя бы одну коллекцию');
  const count = Math.max(1, parseInt($('#train-count').value) || 10);
  const order = $('#train-order').value;

  const statusFilter = $('#train-filter').value;
  let all = [];
  for (const f of files) {
    const c = await api.get(f);
    c.cards.forEach((card, i) => {
      if (statusFilter === 'yes' && !card.remembered) return;
      if (statusFilter === 'no'  &&  card.remembered) return;
      all.push({...card, file: f, index: i});
    });
  }
  if (order === 'random') {
    for (let i = all.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [all[i], all[j]] = [all[j], all[i]];
    }
    all = all.slice(0, count);
  } else if (order === 'asc') {
    // случайные count карточек, но вывод — по номеру билета
    for (let i = all.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [all[i], all[j]] = [all[j], all[i]];
    }
    all = all.slice(0, count);
    const num = t => {
      const m = String(t).match(/^\s*(\d+)/);
      return m ? parseInt(m[1], 10) : Infinity;
    };
    all.sort((a, b) => num(a.title) - num(b.title));
  } else {
    // strict: порядок обхода файлов и карточек
    all = all.slice(0, count);
  }
  train = {queue: all, index: 0, revealed: false};
  // strict: оставляем порядок обхода файлов и карточек
  train = {queue: all.slice(0, count), index: 0, revealed: false};
  $('#train-setup').classList.add('hidden');
  $('#train-run').classList.remove('hidden');
  nextCard();
};

function nextCard() {
  const card = train.queue[train.index];
  if (!card) return endTraining();
  train.revealed = false;
  const el = $('#swipe-card');
  el.className = 'swipe-card';
  el.style.transform = '';
  renderMath($('#swipe-title'), card.title);
  const ans = $('#swipe-answer');
  ans.textContent = '';
  $('#btn-show').classList.toggle('hidden', !card.answer);
  $('#train-progress').textContent =
    `${train.index + 1} / ${train.queue.length}`;
  bindSwipe();
}

function revealAnswer() {
  const card = train.queue[train.index];
  if (!card || !card.answer || train.revealed) return;
  train.revealed = true;
  renderMath($('#swipe-answer'), card.answer);
}

async function answer(remembered) {
  const card = train.queue[train.index];
  if (!card) return;
  // сохраняем статус в md
  await api.status(card.file, card.index, remembered);
  const el = $('#swipe-card');
  el.classList.add(remembered ? 'gone-right' : 'gone-left');
  setTimeout(() => {
    train.index++;
    nextCard();
  }, 180);
}

function endTraining() {
  $('#train-run').classList.add('hidden');
  $('#train-setup').classList.remove('hidden');
  $('#train-progress').textContent = '';
  loadList();
}

$('#btn-show').onclick = revealAnswer;
$('#btn-yes').onclick = () => answer(true);
$('#btn-no').onclick  = () => answer(false);
$('#btn-train-cancel').onclick = loadList;

document.addEventListener('keydown', e => {
  if ($('#view-train').classList.contains('hidden')) return;
  if (e.code === 'Space') { e.preventDefault(); revealAnswer(); }
  if (e.key === 'ArrowLeft')  answer(false);
  if (e.key === 'ArrowRight') answer(true);
});

// свайп
function bindSwipe() {
  const el = $('#swipe-card');
  let sx = 0, sy = 0, dx = 0, dy = 0, down = false;
  const reset = () => { el.style.transform = ''; el.style.opacity = ''; };

  el.onpointerdown = e => {
    if (e.target.closest('button')) return;
    down = true; sx = e.clientX; sy = e.clientY; dx = dy = 0;
    el.setPointerCapture(e.pointerId);
    el.style.transition = 'none';
  };
  el.onpointermove = e => {
    if (!down) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    el.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx/20}deg)`;
    el.style.opacity = String(Math.max(0.3, 1 - Math.abs(dx)/400));
  };
  el.onpointerup = () => {
    if (!down) return;
    down = false;
    el.style.transition = '';
    if (Math.abs(dx) > 90) answer(dx > 0);
    else reset();
  };
  el.onpointercancel = () => { down = false; reset(); };
}

// назад
$('#btn-back').onclick = () => {
  if (!$('#view-train').classList.contains('hidden')) return loadList();
  if (!$('#view-edit').classList.contains('hidden')) return openCollection(current.file);
  loadList();
};

// фильтры
$('#filters').onclick = e => {
  const b = e.target.closest('button[data-f]');
  if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('#filters button').forEach(x =>
    x.classList.toggle('active', x === b));
  renderCards();
};
// переключатель grid/list
function applyViewMode() {
  document.querySelectorAll('#view-toggle button').forEach(b =>
    b.classList.toggle('active', b.dataset.v === viewMode));
  $('#cards').className = viewMode;
}
$('#view-toggle').onclick = e => {
  const b = e.target.closest('button[data-v]');
  if (!b) return;
  viewMode = b.dataset.v;
  localStorage.setItem('viewMode', viewMode);
  applyViewMode();
};
applyViewMode();
loadList();
</script>
</body>
</html>
